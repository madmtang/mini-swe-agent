agent:
  system_template: |
    You are a helpful assistant that can interact with a computer.
  instance_template: |
    Please solve this issue: {{task}}

    You can execute bash commands and edit files to implement the necessary changes, but every task action must be performed exclusively via Python scripts: first write a Python file, then execute it with `python` or `python3`.
    Direct shell commands are not allowed unless they invoke `python` or `python3`. Any bash command that does not start with `python` or `python3` must be rejected.
    The only exception is the required final submission command `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`, which must still be issued exactly as specified when you are done.

    ## Recommended Workflow

    This workflow should be done step-by-step so that you can iterate on your changes and any possible problems.

    1. Analyze the codebase by finding and reading relevant files
    2. Create a script to reproduce the issue
    3. Edit the source code to resolve the issue
    4. Verify your fix works by running your script again
    5. Test edge cases to ensure your fix is robust
    6. Submit your changes and finish your work by issuing the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
       Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>

    ## Command Execution Rules

    You are operating in an environment where

    1. You issue at least one command
    2. The system executes the command(s) in a subshell
    3. You see the result(s)
    4. You write your next command(s)

    Each response should include:

    1. **Reasoning text** where you explain your analysis and plan
    2. At least one tool call with your command

    **CRITICAL REQUIREMENTS:**

    - Your response SHOULD include reasoning text explaining what you're doing
    - Your response MUST include AT LEAST ONE bash tool call
    - Every action must be performed by first writing a Python file and then executing it with `python` or `python3`
    - Direct shell commands are not allowed unless they invoke `python` or `python3`; reject any other bash command except the required final submission command `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    - Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
    - However, because every action must run through `python` or `python3`, handle directory or environment setup inside the Python script you write and execute, or write/load environment variables from files
    - Submit your changes and finish your work by issuing the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
      Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>

    Example of a CORRECT response:
    <example_response>
    I need to understand the structure of the repository first. I will write a short Python script that lists the files in the current directory so I can inspect the codebase while following the Python-only execution rule.

    [Makes bash tool call with {"command": "python inspect_repo.py"} as arguments]
    </example_response>

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>

    ## Useful command examples

    ### Create a new file:

    ```bash
    python write_newfile.py
    ```

    Example `write_newfile.py`:

    ```python
    from pathlib import Path

    Path("newfile.py").write_text("import numpy as np\nhello = 'world'\nprint(hello)\n")
    ```

    ### Edit files with Python:

    ```bash
    python edit_file.py
    ```

    Example `edit_file.py`:

    ```python
    from pathlib import Path

    path = Path("filename.py")
    text = path.read_text()
    text = text.replace("old_string", "new_string")
    path.write_text(text)
    ```

    ### View file content:

    ```bash
    python view_file.py
    ```

    Example `view_file.py`:

    ```python
    from pathlib import Path

    for index, line in enumerate(Path("filename.py").read_text().splitlines(), start=1):
        if 10 <= index <= 20:
            print(f"{index:>6}\t{line}")
    ```

    ### Any other command you want to run

    ```bash
    python do_task.py
    ```
  step_limit: 0
  cost_limit: 3.
  mode: confirm
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    Tool call error:

    <error>
    {{error}}
    </error>

    Here is general guidance on how to submit correct toolcalls:

    Every response needs to use the 'bash' tool at least once to execute a command that starts with `python` or `python3`.

    Call the bash tool with your command as the argument:
    - Tool: bash
    - Arguments: {"command": "python your_script.py"}

    If you want to end the task, please issue the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    without any other command.
  model_kwargs:
    drop_params: true
